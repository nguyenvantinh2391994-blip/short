<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Debug Helper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 15px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-connected {
      background: #2ecc71;
      color: #fff;
    }

    .status-disconnected {
      background: #e74c3c;
      color: #fff;
    }

    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }

    .info-label {
      color: #888;
    }

    .info-value {
      color: #3498db;
      font-weight: 500;
    }

    .info-value.success {
      color: #2ecc71;
    }

    .info-value.error {
      color: #e74c3c;
    }

    .info-value.warning {
      color: #f39c12;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3498db;
      color: #fff;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-success {
      background: #2ecc71;
      color: #fff;
    }

    .btn-success:hover {
      background: #27ae60;
    }

    .btn-warning {
      background: #f39c12;
      color: #fff;
    }

    .btn-warning:hover {
      background: #d68910;
    }

    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .logs-container {
      max-height: 150px;
      overflow-y: auto;
      background: #0f0f23;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
    }

    .log-entry {
      padding: 3px 0;
      border-bottom: 1px solid #222;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: #666;
    }

    .log-info {
      color: #3498db;
    }

    .log-success {
      color: #2ecc71;
    }

    .log-error {
      color: #e74c3c;
    }

    .log-warning {
      color: #f39c12;
    }

    .video-url {
      word-break: break-all;
      font-size: 11px;
      color: #2ecc71;
      background: #0f0f23;
      padding: 8px;
      border-radius: 4px;
      max-height: 60px;
      overflow-y: auto;
    }

    .progress-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3498db, #2ecc71);
      transition: width 0.3s;
    }

    .footer {
      text-align: center;
      padding-top: 10px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Grok Debug Helper</h1>
    <span id="connectionStatus" class="status-badge status-disconnected">Disconnected</span>
  </div>

  <!-- Status Section -->
  <div class="section">
    <div class="section-title">Status</div>
    <div class="info-row">
      <span class="info-label">Page Type:</span>
      <span id="pageType" class="info-value">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Video Status:</span>
      <span id="videoStatus" class="info-value">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Progress:</span>
      <span id="progressText" class="info-value">-</span>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <!-- Video URL Section -->
  <div class="section">
    <div class="section-title">Video URL</div>
    <div id="videoUrl" class="video-url">No video URL captured yet</div>
  </div>

  <!-- Quick Actions -->
  <div class="section">
    <div class="section-title">Quick Actions</div>
    <div class="btn-group">
      <button id="btnDownload" class="btn btn-success">Download</button>
      <button id="btnCopyUrl" class="btn btn-primary">Copy URL</button>
      <button id="btnRefresh" class="btn btn-warning">Refresh</button>
      <button id="btnReset" class="btn btn-danger">Reset</button>
    </div>
  </div>

  <!-- Logs Section -->
  <div class="section">
    <div class="section-title">Recent Logs</div>
    <div id="logsContainer" class="logs-container">
      <div class="log-entry">Waiting for activity...</div>
    </div>
  </div>

  <div class="footer">
    Video Creator Tool v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
